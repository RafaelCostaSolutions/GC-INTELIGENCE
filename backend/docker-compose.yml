services:
  db:
    image: postgres:16
    container_name: gc_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gc_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gc_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: