name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Extract source from tarball (temporary)
        run: |
          if [ ! -f src/App.tsx ]; then
            echo "App.tsx missing — extracting from Gottcured+Home+Limpa.tar.gz"
            tar -xzf Gottcured+Home+Limpa.tar.gz
            mkdir -p src/assets
            mv -f App.tsx src/ 2>/dev/null || true
            mv -f assets/* src/assets/ 2>/dev/null || true
            # Fix logo import path if still pointing to container path
            if grep -q 'container:///' src/App.tsx 2>/dev/null; then
              sed -i 's|container:///mnt/data/src/assets/|./assets/|g' src/App.tsx
            fi
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
